
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      background: #0b1020;
      color: #f5f7ff;
      font-family: Arial, sans-serif;
    }
    main { max-width: 650px; margin: 25px auto; }
    h1 { font-size: 30px; }
    p, .hint { color: #b3bdd3; line-height: 1.6; }
    .panel {
      background: #121a2d;
      border: 1px solid #28324a;
      border-radius: 14px;
      padding: 22px;
      margin: 18px 0;
    }
    label {
      display: block;
      margin-top: 15px;
      font-size: 14px;
      font-weight: bold;
    }
    input, textarea, button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border-radius: 8px;
      font: inherit;
    }
    input, textarea {
      background: #0b1020;
      border: 1px solid #35405b;
      color: white;
    }
    input[type="file"] { padding: 10px; }
    textarea { min-height: 100px; resize: vertical; }
    button {
      border: 0;
      background: #83aaff;
      color: #10182c;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: wait; }
    .secondary { background: #27334d; color: white; }
    .project {
      padding: 14px 0;
      border-bottom: 1px solid #28324a;
      overflow-wrap: anywhere;
    }
    .hidden { display: none !important; }
    #status { overflow-wrap: anywhere; }
    a { color: #9dbdff; }
    .preview {
      display: block;
      max-width: 100%;
      max-height: 260px;
      object-fit: cover;
      border-radius: 8px;
      margin-top: 12px;
    }
    .gallery-item {
      display: inline-block;
      width: 46%;
      margin: 1%;
      vertical-align: top;
      overflow-wrap: anywhere;
    }
    .gallery-item img { width: 100%; }
    .small-button { padding: 9px; font-size: 13px; }
  </style>
</head>
<body>
<main>
  <h1>Portfolio Admin</h1>
  <p>Manage your profile, photos, and projects.</p>

  <section id="login" class="panel">
    <h2>Admin login</h2>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="Your admin email" required>
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Your password" required>
      <button type="submit">Sign in</button>
    </form>
  </section>

  <section id="dashboard" class="hidden">
    <div class="panel">
      <h2>About Me</h2>
      <p>Edit the details visitors will see on your portfolio.</p>
      <form id="profileForm">
        <label for="profileName">Your name</label>
        <input id="profileName" placeholder="Your name" required>

        <label for="headline">Your headline</label>
        <input id="headline" placeholder="Creator, designer, developer...">

        <label for="bio">Your biography</label>
        <textarea id="bio" placeholder="Tell visitors a little about yourself"></textarea>

        <label for="mainPhoto">Main profile photo</label>
        <input id="mainPhoto" type="file" accept="image/*">
        <p class="hint">Choose a photo from your phone. Maximum 5 MB per image.</p>
        <img id="mainPreview" class="preview hidden" alt="Main profile photo preview">
        <button id="uploadMain" type="button">Upload main photo</button>

        <label for="galleryPhotos">Additional photos</label>
        <input id="galleryPhotos" type="file" accept="image/*" multiple>
        <p class="hint">You can select more than one photo.</p>
        <button id="uploadGallery" type="button">Upload selected photos</button>

        <div id="galleryPreview"></div>
        <button type="submit">Save About Me</button>
      </form>
    </div>

    <div class="panel">
      <h2>Add a project</h2>
      <form id="projectForm">
        <label for="title">Project title</label>
        <input id="title" placeholder="Project title" required>
        <label for="description">Description</label>
        <textarea id="description" placeholder="Project description"></textarea>
        <label for="image">Project image URL (optional)</label>
        <input id="image" type="url" placeholder="https://...">
        <label for="url">Project link (optional)</label>
        <input id="url" type="url" placeholder="https://...">
        <button type="submit">Save project</button>
      </form>
    </div>

    <div class="panel">
      <h2>Your projects</h2>
      <div id="projects"></div>
    </div>

    <div class="panel">
      <button id="logout" class="secondary" type="button">Sign out</button>
    </div>
  </section>

  <p id="status" role="status" aria-live="polite"></p>
  <p><a href="index.html">← View public portfolio</a></p>
</main>

<script>
(async function () {
  const status = document.getElementById("status");
  const login = document.getElementById("login");
  const dashboard = document.getElementById("dashboard");
  const profileForm = document.getElementById("profileForm");
  const mainPhotoInput = document.getElementById("mainPhoto");
  const galleryInput = document.getElementById("galleryPhotos");
  const mainPreview = document.getElementById("mainPreview");
  const galleryPreview = document.getElementById("galleryPreview");

  let photoUrl = null;
  let galleryUrls = [];

  if (!window.supabase || !window.SUPABASE_URL ||
      !window.SUPABASE_PUBLISHABLE_KEY) {
    status.textContent = "Connection settings could not be loaded.";
    return;
  }

  const client = window.supabase.createClient(
    window.SUPABASE_URL,
    window.SUPABASE_PUBLISHABLE_KEY
  );

  function showMessage(message) {
    status.textContent = message;
  }

  function safeImageUrl(value) {
    try {
      const url = new URL(value);
      return url.protocol === "https:" ? url.href : null;
    } catch {
      return null;
    }
  }

  function displayMainPhoto(url) {
    const safeUrl = url ? safeImageUrl(url) : null;
    photoUrl = safeUrl;
    mainPreview.classList.toggle("hidden", !safeUrl);
    if (safeUrl) mainPreview.src = safeUrl;
    else mainPreview.removeAttribute("src");
  }

  function displayGallery() {
    galleryPreview.replaceChildren();

    galleryUrls.forEach((url, index) => {
      const safeUrl = safeImageUrl(url);
      if (!safeUrl) return;

      const item = document.createElement("div");
      item.className = "gallery-item";

      const img = document.createElement("img");
      img.className = "preview";
      img.src = safeUrl;
      img.alt = "Gallery photo " + (index + 1);

      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "secondary small-button";
      remove.textContent = "Remove from gallery";
      remove.addEventListener("click", () => {
        galleryUrls.splice(index, 1);
        displayGallery();
        showMessage("Photo removed from the gallery list. Save About Me to confirm.");
      });

      item.append(img, remove);
      galleryPreview.appendChild(item);
    });
  }

  async function uploadImage(file) {
    if (!file || !file.type.startsWith("image/")) {
      throw new Error("Please choose an image file.");
    }

    if (file.size > 5 * 1024 * 1024) {
      throw new Error("Each image must be 5 MB or smaller.");
    }

    const cleanName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    const path = Date.now() + "-" +
      Math.random().toString(36).slice(2) + "-" + cleanName;

    const { error } = await client.storage
      .from("profile-photos")
      .upload(path, file, {
        cacheControl: "3600",
        upsert: false,
        contentType: file.type
      });

    if (error) throw error;

    const { data } = client.storage
      .from("profile-photos")
      .getPublicUrl(path);

    return data.publicUrl;
  }

  async function loadProfile() {
    const { data, error } = await client
      .from("site_profile")
      .select("name, headline, bio, photo_url, gallery_urls")
      .eq("id", 1)
      .maybeSingle();

    if (error) {
      showMessage("Could not load profile: " + error.message);
      return;
    }

    if (!data) return;

    document.getElementById("profileName").value = data.name || "";
    document.getElementById("headline").value = data.headline || "";
    document.getElementById("bio").value = data.bio || "";

    displayMainPhoto(data.photo_url || null);
    galleryUrls = Array.isArray(data.gallery_urls)
      ? data.gallery_urls.filter(url => typeof url === "string")
      : [];
    displayGallery();
  }

  async function saveProfile() {
    const profile = {
      id: 1,
      name: document.getElementById("profileName").value.trim(),
      headline: document.getElementById("headline").value.trim(),
      bio: document.getElementById("bio").value.trim(),
      photo_url: photoUrl,
      gallery_urls: galleryUrls,
      updated_at: new Date().toISOString()
    };

    if (!profile.name) {
      showMessage("Please enter your name.");
      return false;
    }

    const { error } = await client
      .from("site_profile")
      .upsert(profile, { onConflict: "id" });

    if (error) {
      showMessage("Could not save profile: " + error.message);
      return false;
    }

    showMessage("About Me saved successfully.");
    return true;
  }

  async function loadProjects() {
    const { data, error } = await client
      .from("projects")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      showMessage("Could not load projects: " + error.message);
      return;
    }

    const list = document.getElementById("projects");
    list.replaceChildren();

    if (!data || data.length === 0) {
      list.textContent = "No projects added yet.";
      return;
    }

    data.forEach(project => {
      const item = document.createElement("div");
      item.className = "project";

      const heading = document.createElement("h3");
      heading.textContent = project.title || "Untitled project";

      const description = document.createElement("p");
      description.textContent = project.description || "";

      const remove = document.createElement("button");
      remove.className = "secondary";
      remove.textContent = "Delete project";
      remove.addEventListener("click", async () => {
        if (!confirm("Delete this project?")) return;

        const { error } = await client
          .from("projects")
          .delete()
          .eq("id", project.id);

        if (error) showMessage("Delete failed: " + error.message);
        else {
          showMessage("Project deleted.");
          await loadProjects();
        }
      });

      item.append(heading, description, remove);
      list.append(item);
    });
  }

  async function refreshSession() {
    const { data, error } = await client.auth.getSession();
    if (error) showMessage("Could not check sign-in status.");

    const session = data && data.session;
    login.classList.toggle("hidden", !!session);
    dashboard.classList.toggle("hidden", !session);

    if (session) {
      await loadProfile();
      await loadProjects();
    }
  }

  document.getElementById("loginForm").addEventListener("submit", async event => {
    event.preventDefault();
    showMessage("Signing in…");

    const { error } = await client.auth.signInWithPassword({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value
    });

    if (error) {
      showMessage("Sign-in failed: " + error.message);
      return;
    }

    showMessage("Signed in.");
    await refreshSession();
  });

  mainPhotoInput.addEventListener("change", () => {
    const file = mainPhotoInput.files[0];
    if (file) {
      mainPreview.src = URL.createObjectURL(file);
      mainPreview.classList.remove("hidden");
    }
  });

  document.getElementById("uploadMain").addEventListener("click", async () => {
    const file = mainPhotoInput.files[0];
    if (!file) {
      showMessage("Please choose a main photo first.");
      return;
    }

    const button = document.getElementById("uploadMain");
    button.disabled = true;
    showMessage("Uploading main photo…");

    try {
      const url = await uploadImage(file);
      displayMainPhoto(url);
      mainPhotoInput.value = "";
      showMessage("Main photo uploaded. Tap Save About Me to save your changes.");
    } catch (error) {
      showMessage("Photo upload failed: " + error.message);
    } finally {
      button.disabled = false;
    }
  });

  document.getElementById("uploadGallery").addEventListener("click", async () => {
    const files = Array.from(galleryInput.files || []);
    if (!files.length) {
      showMessage("Please select one or more gallery photos first.");
      return;
    }

    const button = document.getElementById("uploadGallery");
    button.disabled = true;
    showMessage("Uploading gallery photos…");

    try {
      for (const file of files) {
        const url = await uploadImage(file);
        galleryUrls.push(url);
      }

      galleryInput.value = "";
      displayGallery();
      showMessage("Photos uploaded. Tap Save About Me to save your changes.");
    } catch (error) {
      displayGallery();
      showMessage("Photo upload failed: " + error.message +
        " Any photos already uploaded may still be in storage.");
    } finally {
      button.disabled = false;
    }
  });

  profileForm.addEventListener("submit", async event => {
    event.preventDefault();
    await saveProfile();
  });

  document.getElementById("projectForm").addEventListener("submit", async event => {
    event.preventDefault();
    showMessage("Saving project…");

    const project = {
      title: document.getElementById("title").value.trim(),
      description: document.getElementById("description").value.trim(),
      image_url: document.getElementById("image").value.trim() || null,
      project_url: document.getElementById("url").value.trim() || null
    };

    const { error } = await client.from("projects").insert(project);

    if (error) {
      showMessage("Could not save project: " + error.message);
      return;
    }

    event.target.reset();
    showMessage("Project saved.");
    await loadProjects();
  });

  document.getElementById("logout").addEventListener("click", async () => {
    await client.auth.signOut();
    showMessage("Signed out.");
    await refreshSession();
  });

  await refreshSession();
})();
</script>
</body>
</html>
